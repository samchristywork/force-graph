<!DOCTYPE html>
<html>
  <head>
    <title>Force Graph</title>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css" type="text/css">
    <script src="event.js" defer></script>
    <script src="render.js" defer></script>
    <script src="verlet.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <canvas width=500 height=500 id="canvas"></canvas>
    <div id="fps"></div>
    <input id="name"></input>
    <input id="tag"></input>
    <input id="toggleNames" type="checkbox" checked>Toggle Names</input>
    <input id="nameFocus" type="checkbox">Toggle Name Focus</input>
    <button id="restart">Restart</button>
    <button id="pause">Pause</button>
    <br>
    <label>Spring k: <input id="sliderK" type="range" min="1" max="500" value="100"><span id="sliderKVal">100</span></label>
    <label>Rest length: <input id="sliderL" type="range" min="1" max="200" value="10"><span id="sliderLVal">10</span></label>
    <label>Drag: <input id="sliderDrag" type="range" min="0" max="20" step="0.1" value="5"><span id="sliderDragVal">5</span></label>
    <label>Repulsion: <input id="sliderRepulsion" type="range" min="0" max="5000000" step="100000" value="1000000"><span id="sliderRepulsionVal">1000000</span></label>
    <label>Boundary: <input id="sliderBoundary" type="range" min="50" max="400" step="10" value="200"><span id="sliderBoundaryVal">200</span></label>
  </body>
</html>
