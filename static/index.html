<!DOCTYPE html>
<html>
  <head>
    <title>Force Graph</title>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css" type="text/css">
    <script src="event.js" defer></script>
    <script src="render.js" defer></script>
    <script src="verlet.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div id="help-modal">
      <div id="help-box">
        <h3>Keyboard Shortcuts</h3>
        <table>
          <tr><td><kbd>f</kbd></td><td>Fit all nodes in view</td></tr>
          <tr><td><kbd>0</kbd></td><td>Reset zoom and pan to default</td></tr>
          <tr><td><kbd>Shift+F</kbd></td><td>Toggle full-screen</td></tr>
          <tr><td><kbd>Space</kbd></td><td>Pause / Resume physics</td></tr>
          <tr><td><kbd>r</kbd></td><td>Restart simulation</td></tr>
          <tr><td><kbd>Esc</kbd></td><td>Clear label filter</td></tr>
          <tr><td><kbd>?</kbd></td><td>Show / hide this help</td></tr>
        </table>
        <p id="help-hint">Click outside or press <kbd>?</kbd> to close</p>
      </div>
    </div>

    <div id="graph-container">
      <canvas id="canvas"></canvas>
      <div id="detail">
        <div id="detailLabel"></div>
        <div id="detailColor"></div>
        <div id="detailDegree"></div>
        <button id="copyLabel" title="Copy label to clipboard">Copy</button>
      </div>
      <div id="tooltip"><div id="tooltip-label"></div><div id="tooltip-degree"></div></div>
      <div id="color-legend"></div>
      <div id="error"></div>
      <div id="loading">Loading...</div>
    </div>

    <div id="toolbar">
      <div class="toolbar-group">
        <input id="name" placeholder="Filter labels…" title="Highlight matching nodes">
        <input id="tag" placeholder="Jump to tag…" title="Press Enter to navigate" list="tag-suggestions">
        <datalist id="tag-suggestions"></datalist>
      </div>
      <div class="toolbar-group">
        <button id="fullscreen" title="Full-screen (Shift+F)">&#x26F6;</button>
        <button id="restart">&#8635; Restart</button>
        <button id="pause">&#9646;&#9646; Pause</button>
        <button id="fit">&#8982; Fit</button>
        <button id="resetView" title="Reset zoom and pan to default (0)">&#8635; Reset View</button>
        <button id="exportPng">&#8659; Export PNG</button>
        <button id="exportJson">&#8659; Export JSON</button>
      </div>
      <div class="toolbar-group">
        <label class="check-label"><input id="toggleNames" type="checkbox" checked> Labels</label>
        <label class="check-label"><input id="nameFocus" type="checkbox"> Focus</label>
      </div>
      <button id="helpButton" title="Keyboard shortcuts (?)">?</button>
      <div id="fps"></div>
    </div>

    <div id="physics-panel">
      <span class="physics-title">Physics</span>
      <label class="slider-label">k <input id="sliderK" type="range" min="1" max="500" value="100"><span id="sliderKVal" class="slider-val">100</span></label>
      <label class="slider-label">length <input id="sliderL" type="range" min="1" max="200" value="10"><span id="sliderLVal" class="slider-val">10</span></label>
      <label class="slider-label">drag <input id="sliderDrag" type="range" min="0" max="20" step="0.1" value="5"><span id="sliderDragVal" class="slider-val">5</span></label>
      <label class="slider-label">repulsion <input id="sliderRepulsion" type="range" min="0" max="5000000" step="100000" value="1000000"><span id="sliderRepulsionVal" class="slider-val">1000000</span></label>
      <label class="slider-label">boundary <input id="sliderBoundary" type="range" min="50" max="400" step="10" value="200"><span id="sliderBoundaryVal" class="slider-val">200</span></label>
      <label class="slider-label">node size <input id="sliderNodeRadius" type="range" min="3" max="20" step="1" value="8"><span id="sliderNodeRadiusVal" class="slider-val">8</span></label>
      <label class="slider-label">min degree <input id="sliderMinDegree" type="range" min="0" max="10" step="1" value="0"><span id="sliderMinDegreeVal" class="slider-val">0</span></label>
      <label class="slider-label">timestep <input id="sliderDt" type="range" min="0.001" max="0.05" step="0.001" value="0.01"><span id="sliderDtVal" class="slider-val">0.01</span></label>
    </div>
  </body>
</html>
